name: Non regression tests for OpenGlassBox
run-name: "Non regression tests on ${{ github.head_ref || github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The logs of GitHub show the colors of MyMakefile, which turns them off by
# itself when its output is not a terminal.
env:
  COLORS: 1

jobs:
  # ============================================================================
  # Linux
  # ============================================================================
  build-linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config libdw-dev lcov libglfw3-dev libglew-dev libgl1-mesa-dev

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Describe the build
        id: info
        run: make -s ci-info >> "$GITHUB_OUTPUT"

      - name: Compile OpenGlassBox and run the non regression tests
        run: make ci

      - name: Gather the build artifacts
        run: make dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openglassbox-linux-x86_64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # Windows
  # ============================================================================
  build-windows:
    name: Build and test on Windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-bc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-make

      - name: Describe the build
        id: info
        shell: msys2 {0}
        run: mingw32-make -s ci-info >> "$GITHUB_OUTPUT"

      - name: Compile OpenGlassBox and run the non regression tests
        shell: msys2 {0}
        run: mingw32-make ci

      - name: Verify Windows runtime dependencies
        shell: msys2 {0}
        run: |
          failed=0
          while read -r dll; do
            echo "DLL dependency: $dll"
            case "$dll" in
              glew32.dll|glfw3.dll|libwinpthread-1.dll|libstdc++-6.dll|libgcc_s_*.dll)
                echo "::error::Unexpected dynamic dependency: $dll"
                failed=1
                ;;
            esac
          done < <(objdump -p ${{ steps.info.outputs.build }}/bin/OpenGlassBox-demo.exe | awk '/DLL Name:/ { print $3 }')
          exit "$failed"

      - name: Gather the build artifacts
        shell: msys2 {0}
        run: mingw32-make dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openglassbox-windows-x86_64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # macOS
  # ============================================================================
  build-macos:
    name: Build and test on macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          brew install make pkg-config lcov glfw glew
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      # The make of macOS is GNU Make 3.81: MyMakefile needs the gmake of brew.
      - name: Describe the build
        id: info
        run: gmake -s ci-info >> "$GITHUB_OUTPUT"

      - name: Compile OpenGlassBox and run the non regression tests
        run: gmake ci

      - name: Gather the build artifacts
        run: gmake dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openglassbox-macos-arm64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # Release packaging (tags and manual runs)
  # ============================================================================
  package:
    name: Package release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      RELEASE_DIR: release/OpenGlassBox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read version
        id: version
        run: echo "version=$(make -s print-PROJECT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          mkdir -p "$RELEASE_DIR/linux-x86_64" "$RELEASE_DIR/windows-x86_64" "$RELEASE_DIR/macos-arm64"

          if [ -d artifacts/openglassbox-linux-x86_64 ]; then
            cp -a artifacts/openglassbox-linux-x86_64/. "$RELEASE_DIR/linux-x86_64/"
            find "$RELEASE_DIR/linux-x86_64" -name "*.so*" -exec chmod +x {} \;
            chmod +x "$RELEASE_DIR/linux-x86_64/bin/"* 2>/dev/null || true
            echo "Linux artifacts copied"
          fi

          if [ -d artifacts/openglassbox-windows-x86_64 ]; then
            cp -a artifacts/openglassbox-windows-x86_64/. "$RELEASE_DIR/windows-x86_64/"
            echo "Windows artifacts copied"
          fi

          if [ -d artifacts/openglassbox-macos-arm64 ]; then
            cp -a artifacts/openglassbox-macos-arm64/. "$RELEASE_DIR/macos-arm64/"
            find "$RELEASE_DIR/macos-arm64/bin" -path "*.app/Contents/MacOS/*" -type f -exec chmod +x {} \; 2>/dev/null || true
            echo "macOS artifacts copied"
          fi

          cp LICENSE "$RELEASE_DIR/"
          cp LICENSING.md "$RELEASE_DIR/"
          echo "${{ steps.version.outputs.version }}" > "$RELEASE_DIR/VERSION"

      - name: Create release archive
        run: |
          ZIP_NAME="OpenGlassBox-${{ steps.version.outputs.version }}.zip"
          cd "$(dirname "$RELEASE_DIR")"
          zip -ry "../$ZIP_NAME" "$(basename "$RELEASE_DIR")"/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v6
        with:
          name: OpenGlassBox-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
