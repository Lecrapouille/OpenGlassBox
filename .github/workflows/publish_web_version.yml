name: Publish the online OpenGlassBox demo on GitHub page
run-name: "Web demo from ${{ github.ref_name }}"
on:
  push:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

# GitHub Pages serves the page from an artifact of the run (no gh-pages
# branch): Settings > Pages > Source must be "GitHub Actions".
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A page opened alone in a browser needs the plain Emscripten build. The
  # ExaequOS build only runs inside the ExaequOS desktop (see build_exaequos).
  build_html5:
    name: Build the web demo
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenGlassBox
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install MyMakefile and Emscripten
        uses: ./.makefile/.github/actions/setup
        with:
          emscripten: true
      # emmake gives em++ as compiler: MyMakefile builds for Emscripten.
      - name: Compile OpenGlassBox-demo
        id: build
        run: |
          emmake make
          emmake make -s ci-info >> "$GITHUB_OUTPUT"
      # The old address (OpenGlassBox-demo.html) keeps working; index.html
      # opens the demo at the root of the site too.
      - name: Gather the page
        run: |
          mkdir -p site
          cp ${{ steps.build.outputs.build }}/bin/OpenGlassBox-demo.* site/
          cp site/OpenGlassBox-demo.html site/index.html
          touch site/.nojekyll
          ls -la site
      - name: Keep the page for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy_html5:
    name: Publish on GitHub Pages
    needs: build_html5
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # The image sets EXAEQUOS and puts emscripten-exa on PATH. `make` then
  # writes the demo, kept as an artifact of the run.
  build_exaequos:
    name: Compile for ExaequOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenGlassBox
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile with ExaequOS
        run: |
          mkdir -p "$HOME/.cache/exaequos"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/exaequos:/opt/emscripten-exa/cache" \
            -w "$PWD" \
            lecrapouille/exaequos:light \
            make
      - name: Keep the ExaequOS build
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlassBox-demo-exaequos
          path: build/exaequos-normal/bin/OpenGlassBox-demo.*
